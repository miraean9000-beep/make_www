<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="중고 물건의 정보를 입력하고 판매글 제목과 본문을 작성하세요.">
  <title>판매글 쓰기 — 뚝딱마켓</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" type="module"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/listings.html"><span aria-hidden="true">↻</span> 뚝딱마켓</a>
      <nav aria-label="주 메뉴">
        <a href="/listings.html">중고장터</a>
        <a href="/listings.html#saved">내 판매글</a>
        <a class="button" href="#write" aria-current="page">+ 판매글 쓰기</a>
      </nav>
    </div>
  </header>
  <main class="wrap write-page">
    <section id="write" aria-labelledby="write-title">
      <div class="section-heading"><h1 id="write-title">판매글 쓰기</h1></div>
      <div class="workspace">
        <form id="listing-form" class="panel" novalidate>
          <div class="panel-head"><h2>물건 정보</h2><span>필수 항목 2개</span></div>
          <label for="item">물건 이름 <span class="required">*</span></label>
          <input id="item" name="item" required maxlength="80" placeholder="예: 닌텐도 스위치 OLED">
          <label for="condition">사용 상태 <span class="required">*</span></label>
          <textarea id="condition" name="condition" required maxlength="500" rows="3" placeholder="예: 본체 뒷면에 긁힘이 있고, 원래 박스는 없어요."></textarea>
          <div class="form-row">
            <div><label for="price">희망 가격</label><input id="price" name="price" maxlength="30" placeholder="예: 22만 원"></div>
            <div><label for="delivery">거래 방법</label><input id="delivery" name="delivery" maxlength="80" placeholder="예: 직거래"></div>
          </div>
          <label for="details">구성품 및 기타 정보</label>
          <textarea id="details" name="details" maxlength="500" rows="2" placeholder="예: 독과 충전기 포함"></textarea>
          <label for="photo">상품 사진 <span class="note">(선택)</span></label>
          <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-help">
          <p id="photo-help" class="note">JPG, PNG, WebP 한 장 · 최대 10MB. 사진을 선택하지 않으면 기본 이미지가 표시돼요.</p>
          <p class="note">연락처나 상세 주소는 입력하지 마세요.</p>
          <button class="button submit" type="submit">판매글 생성하기</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>
        <section id="result" class="panel result" aria-labelledby="result-title">
          <div class="panel-head"><h2 id="result-title">판매글 초안</h2><span>편집 및 복사</span></div>
          <div id="empty" class="empty"><strong>판매글이 여기에 표시됩니다</strong><p>물건 정보를 입력하고 생성 버튼을 눌러보세요.</p></div>
          <div id="draft" hidden>
            <label for="title">제목</label><input id="title">
            <label for="body">본문</label><textarea id="body" rows="8"></textarea>
            <div id="checks" class="checks"><h3>올리기 전 확인</h3><ul id="checklist"></ul></div>
            <button id="copy" class="button secondary" type="button">판매글 복사</button>
            <button id="save" class="button" type="button">목록에 저장</button>
            <p id="copy-status" class="status" role="status"></p>
          </div>
        </section>
      </div>
    </section>
  </main>
  <footer><div class="wrap">뚝딱마켓</div></footer>
</body>
</html>
